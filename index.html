<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="NEXGPT" />
 <meta name="theme-color" content="#1a1a1e" />
<title>NEXGPT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: #1a1a1e;
    display: flex; align-items: center; justify-content: center;
  }
  .splash { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .splash-logo {
    width: 68px; height: 68px; border-radius: 20px;
    background: #1a1a1e; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .splash-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .splash-sub { font-size: 13px; color: #9b9ba8; }
  .splash-loader { display: flex; gap: 6px; margin-top: 8px; }
  .splash-loader span {
    width: 8px; height: 8px; border-radius: 50%; background: #9b9ba8;
    animation: blink 1.2s infinite both;
  }
  .splash-loader span:nth-child(2) { animation-delay: .15s; }
  .splash-loader span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: .3; transform: scale(.85); }
    40% { opacity: 1; transform: scale(1); }
  }
  .error {
    max-width: 380px; padding: 20px; border-radius: 12px;
    border: 1px solid #fecaca; background: #fef2f2; color: #991b1b;
    font-size: 14px; line-height: 1.55; text-align: center;
  }
  .error h2 { font-size: 16px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="splash">
  <div class="splash-logo">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
  </div>
  <div class="splash-title">NEXGPT</div>
  <div class="splash-sub">ɴᴇxᴛ ɢᴇɴᴇʀᴀᴛɪᴏɴ ᴀɪ ᴘʟᴀᴛғᴏʀᴍ</div>
  <div class="splash-loader"><span></span><span></span><span></span></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  // ============================================================
  // HARDCODED FIREBASE CONFIG
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAcg4uh4lqOJ8pwUDmDppyyrmOB9Mv4YZA",
    authDomain: "nexgpt-8249a.firebaseapp.com",
    projectId: "nexgpt-8249a",
    storageBucket: "nexgpt-8249a.firebasestorage.app",
    messagingSenderId: "619126243121",
    appId: "1:619126243121:web:47c46e57498d67ff107a10"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let redirected = false;
  onAuthStateChanged(auth, (user) => {
    if (redirected) return;
    redirected = true;
    window.location.replace(user ? '/chat' : '/login');
  });

  setTimeout(() => {
    if (!redirected) {
      redirected = true;
      window.location.replace('/login');
    }
  }, 6000);
</script>
</body>
</html>
